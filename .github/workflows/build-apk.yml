name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Allo CMPF Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Prebuild Native Android Project
        working-directory: ./mobile
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradlew Executable
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Build Android Release APK
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Find and Rename APK
        run: |
          mkdir -p output
          find mobile/android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output/Allo-CMPF.apk \;

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Allo-CMPF-Android-APK
          path: output/Allo-CMPF.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Allo CMPF App v1.0.0 (Build #${{ github.run_number }})
          body: |
            ### 🚑 Allo CMPF - Application Android (APK)
            
            Téléchargez le fichier APK directement sur votre téléphone pour installer l'application.
            
            - **Nom de l'application :** Allo CMPF
            - **Version :** 1.0.0 (Build #${{ github.run_number }})
            - **Fichier :** `Allo-CMPF.apk`
          files: output/Allo-CMPF.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
